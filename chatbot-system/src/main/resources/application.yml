spring:
  application:
    name: chatbot-early-warning-system
  
  # MySQL Configuration (Moodle database)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/moodle?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        use_sql_comments: true
    open-in-view: false
  
  # Security (DISABLED for development)
  # security:
  #   user:
  #     name: admin
  #     password: admin123

# OpenAI API Configuration
# Đặt giá trị thực qua biến môi trường để tránh lộ bí mật trong repo.
openai:
  api:
    key: ${OPENAI_API_KEY:}
    url: https://api.openai.com/v1/chat/completions
    model: ${OPENAI_MODEL:gpt-4o-mini}
    timeout: 30000

# Moodle API Configuration
moodle:
  api:
    base-url: ${MOODLE_BASE_URL:http://localhost/moodle}
    token: ${MOODLE_API_TOKEN:}
    wsfunction-prefix: core_
    timeout: 30000
    max-retries: 3
    retry-delay: 1000

# JWT Configuration
jwt:
  secret: chatbot-kltn-2026-secret-key-nguyen-dinh-nhat-huy-110122223-da22ttb
  expiration: 86400000  # 24 hours in milliseconds
  issuer: chatbot-kltn-system

# WebSocket Configuration
websocket:
  endpoint: /ws
  topic-prefix: /topic
  app-prefix: /app

# Logging Configuration
logging:
  level:
    root: INFO
    com.kltn.chatbot: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  file:
    name: logs/chatbot-system.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Server Configuration
server:
  port: 8082
  servlet:
    context-path: /
  error:
    include-message: always
    include-stacktrace: on_param

# Application Configuration
app:
  risk-analysis:
    green-threshold:
      completion-rate: 80
      grade-average: 5.0
      attendance-rate: 80
    yellow-threshold:
      grade-average: 5.0
      attendance-rate: 20
    red-threshold:
      last-access-days: 14
  sync:
    interval-hours: 6
  notification:
    retention-days: 90
